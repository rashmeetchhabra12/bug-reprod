[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bugrepro"
version = "0.1.0"
description = "Reproduce a reported web-app bug with a scripted browser recipe, then replay it."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
bugrepro = "bugrepro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp"