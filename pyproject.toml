[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bugrepro"
version = "0.1.0"
description = "ReproWitness: local browser-evidence investigations and model-free recipe replay."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49",
]

[project.urls]
Homepage = "https://github.com/rashmeetchhabra12/ReproWitness"
Repository = "https://github.com/rashmeetchhabra12/ReproWitness"
Documentation = "https://github.com/rashmeetchhabra12/ReproWitness/blob/main/docs/USAGE.md"
Issues = "https://github.com/rashmeetchhabra12/ReproWitness/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
bugrepro = "bugrepro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp"
